name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Periodic rebuild so sitemap.xml / robots.txt stay current even when no
  # code changes: BlogPost/LanguagePair content lives in Base44, not in this
  # repo, so a push-only trigger would never pick up a newly published blog
  # post. Every run does a full rebuild (scripts/generate-sitemap.mjs runs
  # as part of `prebuild`) and redeploys, whether or not source changed. To
  # change the interval, edit the cron expression below (currently every 6
  # hours) — new content is visible in the live sitemap/robots.txt within
  # this interval, not instantly.
  schedule:
    - cron: "0 */6 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next
      - name: Install dependencies
        run: npm ci
      - name: Fetch build-time content from Base44
        run: node scripts/fetchBuildTimeContent.mjs
        env:
          BASE44_API_KEY: ${{ secrets.BASE44_API_KEY }}
      - name: Build with Next.js
        run: npx next build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
